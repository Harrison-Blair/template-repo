name: Feature
description: Request new functionality or a user-facing capability.
title: "[FEATURE] "
labels:
  - Feature
assignees:
  - Harrison-Blair
body:
  - type: dropdown
    id: story-points
    attributes:
      label: Story points
      description: Fibonacci estimate. Leave blank or pick `?` if unsure.
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
        - "13"
        - "?"
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - CRITICAL
        - HIGH
        - MEDIUM
        - LOW
        - NONVITAL
    validations:
      required: false
  - type: textarea
    id: user-story
    attributes:
      label: User story
      value: |
        As a <role>,
        I want <capability>,
        Because <benefit>.
    validations:
      required: true
  - type: textarea
    id: functional-requirements
    attributes:
      label: Functional requirements
      description: What the feature must do.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Conditions that must be met for this feature to be considered complete. Uses checkbox markdown so reviewers can tick items.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: related-documentation
    attributes:
      label: Related documentation
      description: Links to docs, issues, PRs, or other context.
    validations:
      required: false
