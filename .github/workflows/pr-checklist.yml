name: PR checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Verify pre-merge checklist
        uses: actions/github-script@v7
        with:
          script: |
            // Parses the "Pre-merge checklist" section of the PR body and
            // fails the check if any item is unticked. Tied to the checklist
            // section in .github/pull_request_template.md — renaming that
            // section header requires updating the regex below.
            const pr = context.payload.pull_request;
            const body = (pr.body || '').replace(/\r\n/g, '\n');

            const sectionRe = /##\s+Pre-merge checklist\s*\n([\s\S]*?)(?=\n##\s|$)/i;
            const sectionMatch = body.match(sectionRe);

            if (!sectionMatch) {
              core.setFailed(
                'No "## Pre-merge checklist" section found in the PR body. ' +
                'Make sure the PR template is being used and the section is present.'
              );
              return;
            }

            const itemRe = /^\s*-\s+\[([ xX])\]\s+(.+)$/gm;
            const items = [];
            let m;
            while ((m = itemRe.exec(sectionMatch[1])) !== null) {
              items.push({
                checked: m[1].toLowerCase() === 'x',
                text: m[2].trim(),
              });
            }

            if (items.length === 0) {
              core.setFailed(
                'No checklist items found in the Pre-merge checklist section. ' +
                'Check that items are formatted as `- [ ] item`.'
              );
              return;
            }

            core.info(`Checklist items: ${items.length}`);
            for (const item of items) {
              core.info(`  [${item.checked ? 'x' : ' '}] ${item.text}`);
            }

            const unchecked = items.filter(i => !i.checked);

            if (unchecked.length === 0) {
              core.info('All checklist items checked — passing.');
              return;
            }

            const list = unchecked.map(i => `  - [ ] ${i.text}`).join('\n');
            core.setFailed(
              `Pre-merge checklist incomplete — ${unchecked.length} of ${items.length} items unchecked:\n` +
              `${list}\n\n` +
              `Tick each item in the PR description before merging. ` +
              `If this check is a required status check, admins can bypass it.`
            );
