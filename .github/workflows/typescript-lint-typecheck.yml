name: TypeScript lint & typecheck

on:
  pull_request:
    paths:
      - 'src/**'
      - '*.ts'
      - '*.tsx'
      - '*.mts'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typescript-lint-typecheck.yml'

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit
