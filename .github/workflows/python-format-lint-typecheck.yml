name: Python format, lint & typecheck

on:
  pull_request:
    paths:
      - 'python/**/*.py'
      - 'python/**/pyproject.toml'
      - '.github/workflows/python-format-lint-typecheck.yml'

jobs:
  format-lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install workspace with dev extras
        run: pip install -e '.[dev]'

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy .
